qca: # config type
    username:
        - "USERNAME"
        - "NAME of the environment variable holding the Kubernetes username for secret, e.g., 'NRP_USER'"
    password:
        - "PASSWORD"
        - "NAME of the environment variable holding the Kubernetes password for secret, e.g., 'NRP_PASSWORD'"
    user:
        - "USER"
        - "YOUR personal identifier for deployments and secrets, e.g., 'my-organization-my-initials'"
    namespace:
        - "NAMESPACE"
        - "Your team namespace (e.g., openforcefield)"
    container_name:
        - "CONTAINERNAME"
        - "Name for type of deployed containers (e.g., 'openff-pod')"
    container_image:
        - "CONTAINERIMAGE"
        - "Link to container image, e.g., ghcr.io/..."
    cluster_name:
        - "CLUSTERNAME"
        - "Name of kubernetes cluster"
