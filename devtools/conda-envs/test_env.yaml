name: test
channels:
  - conda-forge
  - defaults

dependencies:
    # Base depends
  - python=3.12
  - pip
  - numpy
  - pyyaml
  - InquirerPy
  - kubernetes
  - pandas
  - ipython

    # Docs
  - sphinx>2.1
  - docutils>=0.17
  - sphinx-copybutton
  - pydata-sphinx-theme>=0.15
  - nbsphinx
  - nbconvert>=7

    # Testing
  - pytest
  - pytest-cov
  - codecov

    # Pip-only installs
  - pip:
    - codecov
    - kubernetes
    - sphinx-design
    - ../..
